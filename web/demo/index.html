<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Microvium in the browser</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 52rem; margin: 3rem auto; padding: 0 1.25rem; }
      h1 { font-size: 1.8rem; }
      textarea { box-sizing: border-box; width: 100%; min-height: 15rem; font: 14px/1.5 ui-monospace, monospace; }
      button { margin: 1rem 0; padding: .6rem 1rem; font: inherit; }
      pre { padding: 1rem; min-height: 3rem; white-space: pre-wrap; background: #8882; }
      #status[data-kind="error"] { color: #c33; }
    </style>
  </head>
  <body>
    <h1>Microvium compiler and runtime in WebAssembly</h1>
    <p>The compiler and C runtime run as standalone WebAssembly modules. The compiler has no filesystem or WASI imports.</p>
    <label for="source">Microvium source</label>
    <textarea id="source" spellcheck="false">const host = vmImport(1);
vmExport(1, function (n) {
  return n + host(n);
});</textarea>
    <button id="run" type="button">Compile + run</button>
    <p id="status" role="status">Ready</p>
    <pre id="result" aria-live="polite"></pre>
    <script src="./app.js" defer></script>
  </body>
</html>
